<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Git Saeid</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <nav class="navbar navbar-light bg-light">
      <div
        class="container-fluid d-flex flex-wrap justify-content-center justify-content-md-between align-items-center"
      >
        <div class="d-flex justify-content-center align-items-center gap-2">
          <!-- دکمه همبرگری -->
          <button
            type="button"
            class="btn btn-light btn-sm d-flex justify-content-center align-items-center"
          >
            <span
              class="navbar-toggler-icon small-toggler-icon"
              style="width: 20px; height: 20px; background-size: 100% 100%"
            ></span>
          </button>

          <!-- لوگو -->
          <img src="img/cat.png" class="cat" alt="logo" />
          <button
            type="button"
            class="btn btn-light btn-sm d-flex justify-content-center align-items-center"
          >
            <span>Dashboard</span>
          </button>
          <!-- عنوان -->
        </div>

        <div class="d-flex justify-content-center align-items-center gap-2">
          <div class="position-relative m-0">
            <input
              type="text"
              class="form-control form-control-sm custom-input"
              placeholder="type / to search"
              aria-label="جستجو"
              style="border-radius: 5px; padding-left: 25px"
            />
            <i
              class="bi bi-search"
              style="
                position: absolute;
                left: 5px;
                top: 50%;
                transform: translateY(-50%);
                color: #888;
                font-size: 14px;
                pointer-events: none;
              "
            >
            </i>
          </div>

          <div class="btn-group" role="group">
            <button
              type="button"
              class="btn btn-light btn-sm"
              style="
                border: 1px solid #b0b0b0;
                border-top-left-radius: 5px;
                border-bottom-left-radius: 5px;
              "
            >
              <i class="fas fa-frog" style="font-size: 16px; color: #333"></i>
            </button>

            <!-- دکمه سمت راست (فلش پایین) -->
            <button
              type="button"
              class="btn btn-light btn-sm"
              style="
                border: 1px solid #b0b0b0;
                border-top-right-radius: 5px;
                border-bottom-right-radius: 5px;
              "
            >
              <i
                class="bi bi-caret-down-fill"
                style="font-size: 14px; color: #333"
              ></i>
            </button>
          </div>

          <span style="color: #a1a1a1">|</span>
          <div>
            <button
              type="button"
              class="btn btn-light btn-sm d-flex"
              style="border-radius: 10px; border: 1px solid #b0b0b0"
            >
              <!-- آیکون مثبت -->
              <i class="bi bi-plus" style="font-size: 16px; color: #333"></i>

              <!-- فاصله افقی -->
              <span style="width: 4px"></span>

              <!-- فلش پایین -->
              <i
                class="bi bi-caret-down-fill"
                style="font-size: 15px; color: #333"
              ></i>
            </button>
          </div>

          <div>
            <button
              type="button"
              class="btn btn-light btn-sm"
              style="border-radius: 8px; border: 1px solid #b0b0b0"
            >
              <i class="bi bi-record-circle"></i>
            </button>
          </div>
          <div>
            <button
              type="button"
              class="btn btn-light btn-sm"
              style="border-radius: 8px; border: 1px solid #b0b0b0"
            >
              <i class="bi bi-git"></i>
            </button>
          </div>
          <div>
            <button
              type="button"
              class="btn btn-light btn-sm"
              style="border-radius: 8px; border: 1px solid #b0b0b0"
            >
              <i class="bi bi-eraser"> </i>
            </button>
          </div>
          <div class="circle"></div>
        </div>
      </div>
    </nav>

    <script src="js/bootstrap.bundle.min.js"></script>
  </body>
</html>
